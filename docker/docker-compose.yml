# HallFlix on a UGREEN NAS. Paste this into Docker > Project > Create.
# Change only the lines marked  <-- CHANGE, and only the part before the first colon.
# Example: if your movies are in /volume2/Videos, the line becomes  - /volume2/Videos:/media:ro
name: hallflix

services:
  hallflix:
    image: ghcr.io/justhallwest-commits/hallflix-site:latest
    command: server
    restart: unless-stopped
    depends_on: [db, transcoder]
    ports:
      - "8780:8780"                                   # HallFlix opens at http://<NAS address>:8780
    environment:
      DATABASE_URL: postgres://hallflix:hallflix@db:5432/hallflix
      TRANSCODER_URL: http://transcoder:8781
      # COMIC_CACHE_GB: 4                              # optional: room for unpacked CBR/CB7 comics (oldest read are cleared first)
    volumes:
      - /volume1/docker/hallflix/data:/data            # HallFlix's own files: artwork cache, uploads, plugins
      - /volume1/Media:/media:ro                       # <-- CHANGE: your media share, then keep  :/media:ro  exactly
                                                       #     (to let admins delete files from HallFlix, drop the :ro on this line only)
      # - /volume1/Media/Artwork:/artwork:ro           # optional: an artwork folder outside your media share (then add /artwork in Studio → Artwork → NAS folders)

  transcoder:
    image: ghcr.io/justhallwest-commits/hallflix-site:latest
    command: transcoder
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8781/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
    volumes:
      - /volume1/Media:/media:ro                       # <-- CHANGE: the same as the line above
      - transcode:/transcode
    devices:
      - /dev/dri:/dev/dri                              # the NAS graphics chip, for fast video conversion

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hallflix
      POSTGRES_PASSWORD: hallflix                      # only reachable by the two containers above, never from your network
      POSTGRES_DB: hallflix
    volumes:
      - /volume1/docker/hallflix/db:/var/lib/postgresql/data   # the HallFlix database: profiles, history, looks

volumes:
  transcode:
