name: Build and test
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: hallflix, POSTGRES_PASSWORD: hallflix, POSTGRES_DB: hallflix_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hallflix" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils libarchive-tools
      - run: npm install
        working-directory: server
      - run: npm test
        working-directory: server
        env: { DATABASE_URL: "postgres://hallflix:hallflix@127.0.0.1:5432/hallflix_test" }

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/justhallwest-commits/hallflix-site:latest
            ghcr.io/justhallwest-commits/hallflix-site:${{ github.sha }}

  apps:
    # The Android APK (Fire TV, Android TV, phones) and the Roku channel, published to the "apps" release.
    # Pull requests build it too, so a change that breaks the app shows up before merge; only main publishes.
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Signing key
        if: github.event_name == 'push'
        env:
          KEYSTORE_B64: ${{ secrets.HALLFLIX_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HALLFLIX_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hallflix.p12"
            echo "HALLFLIX_KEYSTORE=$RUNNER_TEMP/hallflix.p12" >> "$GITHUB_ENV"
            echo "HALLFLIX_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNED_WITH=HallFlix key" >> "$GITHUB_ENV"
          else
            echo "::warning::HALLFLIX_KEYSTORE_B64 is not set, so this APK is signed with a temporary key and will not install over other builds."
            echo "SIGNED_WITH=temporary key" >> "$GITHUB_ENV"
          fi
      - name: Build the APK
        env: { BUILD_NUMBER: "${{ github.run_number }}" }
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Package the Roku channel
        run: |
          sed -i "s/^build_version=.*/build_version=${{ github.run_number }}/" roku/manifest
          npx --yes brighterscript@0.65 --rootDir roku --createPackage false
          (cd roku && zip -qr ../hallflix-roku.zip manifest source components images)
      - name: Publish to the apps release
        if: github.event_name == 'push'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk hallflix.apk
          notes="HallFlix apps, build ${{ github.run_number }} (${GITHUB_SHA::7}), APK signed with the $SIGNED_WITH.

          - hallflix.apk: Fire TV, Android TV and Android phones. On a Fire TV, type your server's /get/android link into Downloader.
          - hallflix-roku.zip: upload it to your Roku's Developer Settings page (see docker/INSTALL.md)."
          gh release view apps >/dev/null 2>&1 || gh release create apps --title "HallFlix apps" --notes "$notes" --latest=false
          gh release edit apps --notes "$notes" --title "HallFlix apps (build ${{ github.run_number }})"
          # version.json: what the app checks to offer "Update available", with the signing key's fingerprint so an app
          # signed with another key knows an update can't install over it.
          signer=""
          if [ -n "$HALLFLIX_KEYSTORE" ]; then
            signer=$(keytool -list -v -keystore "$HALLFLIX_KEYSTORE" -storetype PKCS12 -storepass "$HALLFLIX_KEYSTORE_PASSWORD" 2>/dev/null | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          fi
          printf '{"versionCode":%s,"versionName":"1.0.%s","signer":"%s","sha":"%s","built":"%s"}\n' "${{ github.run_number }}" "${{ github.run_number }}" "$signer" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json
          cat version.json
          gh release upload apps hallflix.apk hallflix-roku.zip version.json --clobber
